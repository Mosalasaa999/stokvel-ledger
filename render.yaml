services:
  - type: web
    name: mosalasa-stokvel-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true

  - type: web
    name: stokvel-ledger-pwa
    runtime: static
    rootDir: frontend
    buildCommand: npm install && VITE_API_URL="https://${API_HOST}.onrender.com" npm run build
    staticPublishPath: dist
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: mosalasa-stokvel-api
          property: host
